<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4 - Step 3</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Raleway&display=swap" rel="stylesheet">
</head>
<body>
    <div class="simulation-container">
        <h1 class="title">Apparent Density of Leather</h1>
        <p class="instruction-text" id="instructionText">
            <span class="step-badge" id="stepBadge">Step 3</span>
            <span id="stepText">Click on the highlighted area to start step 3.</span>
        </p>
        <div class="sim-area" id="step3">
            <!-- Explicit image layers to avoid runtime loading lag -->
            <img id="static3_first" class="media-layer" src="../assets/gifs/Step c_first.gif">
            <img id="gif3" class="media-layer" style="display: none;">
            
            <!-- Interaction Layer for Step 3 -->
            <div id="interactionLayer3a" class="interaction-layer">
                <div class="transbox" id="transbox3a" title="Click here for step 3!"></div>
                <img src="../assets/gifs/arrow_down.gif" class="arrow" id="arrow3a">
            </div>
        </div>
        <div class="toolbar">
            <button class="btn-nav btn-prev" id="prevBtn">◀ Back</button>
            <div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="width:50%"></div></div>
            <button class="btn-nav btn-next" id="nextToStep4">Next ▶</button>
        </div>
    </div>
    <script src="step3.js"></script>
</body>
</html>
