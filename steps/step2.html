<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4 - Step 2</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Raleway&display=swap" rel="stylesheet">
</head>
<body>
    <div class="simulation-container">
        <h1 class="title">Apparent Density of Leather</h1>
        <p class="instruction-text" id="instructionText">
            
            <span id="stepText">Click on the highlighted area to start step 2a.</span>
        </p>
        <div class="sim-area" id="step2">
            <!-- Explicit image layers to avoid runtime loading lag -->
            <img id="static2a_first" class="media-layer" src="../assets/gifs/Step b1_first.gif">
            <img id="static2a_last" class="media-layer" src="../assets/gifs/Step b1_last.gif" style="display: none;">
            <img id="static2b_last" class="media-layer" src="../assets/gifs/Step b2_last.gif" style="display: none;">
            <img id="static2c_last" class="media-layer" src="../assets/gifs/Step b3_last.gif" style="display: none;">
            <img id="gif2" class="media-layer" style="display: none;">
            
            <!-- Interaction Layer for Step 2a -->
            <div id="interactionLayer2a" class="interaction-layer">
                <div class="transbox" id="transbox2a" title="Click here for step 2a!"></div>
                <img src="../assets/gifs/arrow_down.gif" class="arrow" id="arrow2a">
            </div>

            <!-- Interaction Layer for Step 2b (hidden initially) -->
            <div id="interactionLayer2b" class="interaction-layer" style="display: none;">
                <div class="transbox" id="transbox2b" title="Click here for step 2b!"></div>
                <img src="../assets/gifs/arrow_down.gif" class="arrow" id="arrow2b">
            </div>

            <!-- Interaction Layer for Step 2c (hidden initially) -->
            <div id="interactionLayer2c" class="interaction-layer" style="display: none;">
                <div class="transbox" id="transbox2c" title="Click here for step 2c!"></div>
                <img src="../assets/gifs/arrow_down.gif" class="arrow" id="arrow2c">
            </div>
        </div>
        <div class="toolbar">
            <button class="btn-nav btn-prev" id="prevBtn">◀ Back</button>
            <div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="width:30%"></div></div>
            <button class="btn-nav btn-next" id="nextToStep3">Next ▶</button>
        </div>
    </div>
    <script src="step2.js"></script>
</body>
</html>
