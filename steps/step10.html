<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4 - Step 10</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Raleway&display=swap" rel="stylesheet">
</head>
<body>
    <div class="simulation-container">
        <h1 class="title">Apparent Density of Leather</h1>
        <p class="instruction-text" id="instructionText">
            <span id="stepText">Click on the highlighted area to start step 10.</span>
        </p>
        <div class="sim-area" id="step10">
            <!-- Explicit image layers to avoid runtime loading lag -->
            <img id="static10a_first" class="media-layer" src="../assets/gifs/Step F2_first.gif">
            <img id="static10a_last" class="media-layer" src="../assets/gifs/Step F2_last.gif" style="display: none;">
            <img id="gif10" class="media-layer" style="display: none;">
            
            <!-- Interaction Layer for Step 10 -->
            <div id="interactionLayer10a" class="interaction-layer">
                <div class="transbox" id="transbox10a" title="Click here for step 10!"></div>
                <img src="../assets/gifs/arrow_down.gif" class="arrow" id="arrow10a">
            </div>
        </div>
        <div class="toolbar">
            <button class="btn-nav btn-prev" id="prevBtn">◀ Back</button>
            <div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="width:100%"></div></div>
            <button class="btn-nav btn-next" id="nextToFinish">Next ▶</button>
        </div>
    </div>
    <script src="step10.js"></script>
</body>
</html>
